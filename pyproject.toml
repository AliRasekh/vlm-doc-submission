[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-doc"
version = "0.1.0"
description = "Vision-language document QA research utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "integration: requires local images or private experiment caches; skipped when absent",
]
testpaths = ["tests", "companion/pascal/tests"]
pythonpath = ["src", "companion/pascal"]
addopts = "-q"
