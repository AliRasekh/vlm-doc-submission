adapter: internvl3
model_id: OpenGVLab/InternVL3-1B
revision: 4415a3b810e636d11dfa86b0e9ba40bb00535aa8
prefer_bf16: true
use_flash_attn: false
max_num: 12
use_thumbnail: true
image_size: 448
instruction: "Answer the question using a single word or short phrase."
max_new_tokens: 64

# Data
train_manifest: data/manifests/docvqa_train_subset_v1.json
train_answers: data/cache/docvqa_train_subset_v1_answers.json
target_field: target_answer
target_selection_rule: first_nonempty_source_listed_answer

# LoRA (language_model attention only)
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_bias: none

# Optim
lr: 5.0e-5
weight_decay: 0.01
grad_clip: 1.0
microbatch_size: 1
grad_accum: 8
max_updates: 200
warmup_updates: 10
seed: 42
max_seq_length: 8192
gradient_checkpointing: true

# Checkpoints (persistent project path; not /local)
checkpoint_root: checkpoints/internvl3_1b_lora_v1
save_updates: [100, 200]

# Logging
log_jsonl: results/train_internvl3_1b_lora_v1.jsonl
summary_json: results/train_internvl3_1b_lora_v1_summary.json
